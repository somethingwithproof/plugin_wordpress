name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  entry-point-lint:
    name: PHP 8.0 entry point lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.0'
          coverage: none

      - name: Lint PHP 8.0 entry points
        run: |
          set -euo pipefail
          php -v
          for f in *.php include/*.php cli/*.php scripts/ss_wordpress_stats.php; do
            php -l "$f"
          done

  unit-and-static-analysis:
    name: PHP ${{ matrix.php }} unit, PHPDoc, coverage, and PHPStan L9
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Cacti 1.2.31 for symbol scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Cacti/cacti
          ref: release/1.2.31
          path: cacti

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl, pdo, pdo_mysql, pdo_sqlite, simplexml
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}

      - name: Lint all PHP files
        run: |
          set -euo pipefail
          find lib tests cli include scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in *.php; do php -l "$f"; done

      - name: Install dev tools (zero runtime dependencies)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit, security, and PHPDoc quality tests
        if: matrix.php != '8.4'
        run: vendor/bin/phpunit -c phpunit.xml

      - name: Run tests with pcov coverage and enforce 85% line floor
        if: matrix.php == '8.4'
        run: |
          set -euo pipefail
          mkdir -p coverage
          php -d pcov.enabled=1 -d pcov.directory=. vendor/bin/phpunit -c phpunit.xml --coverage-clover coverage/clover.xml --coverage-text
          php -r '
            $xml = simplexml_load_file("coverage/clover.xml");
            if ($xml === false || !isset($xml->project->metrics)) {
              fwrite(STDERR, "Failed to parse coverage/clover.xml\n");
              exit(1);
            }
            $m = $xml->project->metrics;
            $statements = (int) $m["statements"];
            $covered    = (int) $m["coveredstatements"];
            $pct        = $statements > 0 ? ($covered / $statements) * 100.0 : 0.0;
            printf("Measured line coverage: %.2f%% (%d/%d statements)\n", $pct, $covered, $statements);
            if ($pct < 85.0) {
              fwrite(STDERR, sprintf("Coverage %.2f%% is below required 85.00%% threshold.\n", $pct));
              exit(1);
            }
          '

      - name: Run PHPStan Level 9
        env:
          CACTI_PATH: ${{ github.workspace }}/cacti
        run: vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=1G --no-progress

  cacti-integration:
    name: Integration PHP ${{ matrix.php }} on Cacti ${{ matrix.cacti }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        cacti: ['release/1.2.31', '1.2.x']

    services:
      mariadb:
        image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
        env:
          MYSQL_ROOT_PASSWORD: cactiroot
          MYSQL_DATABASE: cacti
          MYSQL_USER: cactiuser
          MYSQL_PASSWORD: cactiuser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Cacti
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Cacti/cacti
          ref: ${{ matrix.cacti }}
          path: cacti

      - name: Checkout plugin_wordpress
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: cacti/plugins/wordpress

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring, snmp, openssl
          ini-values: "post_max_size=256M, max_execution_time=60, date.timezone=UTC"
          coverage: none

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rrdtool gettext mariadb-client

      - name: Initialize Cacti MariaDB schema
        run: |
          printf "[client]\nuser = root\npassword = cactiroot\nhost = 127.0.0.1\n" > ~/.my.cnf
          chmod 600 ~/.my.cnf
          mariadb -e "CREATE USER IF NOT EXISTS 'cactiuser'@'127.0.0.1' IDENTIFIED BY 'cactiuser';"
          mariadb -e "GRANT ALL PRIVILEGES ON cacti.* TO 'cactiuser'@'127.0.0.1';"
          mariadb -e "GRANT SELECT ON mysql.time_zone_name TO 'cactiuser'@'127.0.0.1';"
          mariadb -e "FLUSH PRIVILEGES;"
          mariadb cacti < cacti/cacti.sql
          mariadb -e "INSERT INTO settings (name, value) VALUES ('path_php_binary', '$(command -v php)')" cacti

      - name: Configure and install Cacti
        run: |
          sed -r "s/localhost/127.0.0.1/g" cacti/include/config.php.dist > cacti/include/config.php
          cd cacti
          php cli/install_cacti.php --accept-eula --install --force
          php cli/plugin_manage.php --plugin=wordpress --install --enable

      - name: Install dev tools for integration test runner
        working-directory: cacti/plugins/wordpress
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run MariaDB integration tests
        working-directory: cacti/plugins/wordpress
        env:
          CACTI_PATH: ${{ github.workspace }}/cacti
        run: vendor/bin/phpunit -c phpunit-integration.xml

      - name: Smoke-test CLI and script server
        working-directory: cacti
        run: |
          set -euo pipefail
          php plugins/wordpress/cli/wordpress.php export --format=yaml > /tmp/wp-export.yaml
          php plugins/wordpress/cli/wordpress.php export --format=xml > /tmp/wp-export.xml
          php plugins/wordpress/cli/wordpress.php validate --file=/tmp/wp-export.yaml
          php plugins/wordpress/cli/wordpress.php validate --file=/tmp/wp-export.xml
          php plugins/wordpress/cli/wordpress.php plan --file=/tmp/wp-export.yaml --format=json
          php plugins/wordpress/cli/wordpress.php health --format=text
          php plugins/wordpress/cli/wordpress.php health --format=json
          php plugins/wordpress/poller_wordpress.php --poller=1 --shard=1/1 --dry-run --format=json
          php plugins/wordpress/scripts/ss_wordpress_stats.php 1
